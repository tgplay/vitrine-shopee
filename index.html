      "Eletrônicos": "smartphone",
      "Ferramentas": "wrench",
      "Saúde & Fitness": "heart-pulse",
      "Beleza & Cuidados": "scissors",
      "Pet": "paw-print"
    };

    const ITEMS_PER_PAGE = 20;
    let currentPage = 1;
    let currentCategory = "Todas";
    let searchQuery = "";

    // Categorias saem dos próprios produtos, para não sobrar aba vazia
    const categories = ["Todas", ...Object.keys(categoryIcons).filter(cat => products.some(p => p.category === cat))];

    const formatBRL = value => `R$ ${value.toFixed(2).replace('.', ',')}`;

    // Busca ignora maiúsculas, acentos e letras estilizadas (ex.: 𝙨𝙝𝙤𝙥𝙚 → shope)
    const normalize = text => text.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();

    document.addEventListener("DOMContentLoaded", () => {
      renderCategories();
      renderProducts();
      document.getElementById("search-input").addEventListener("input", (e) => {
        searchQuery = normalize(e.target.value);
        currentPage = 1;
        renderProducts();
      });
      lucide.createIcons();
    });

    function renderCategories() {
      const container = document.getElementById("categories-container");
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${currentCategory === cat ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600'}">${cat}</button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderCategories();
      renderProducts();
    }

    function renderImage(p) {
      if (p.image) {
        return `<img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" loading="lazy">`;
      }
      return `
        <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-orange-50 to-amber-100 text-orange-400">
          <i data-lucide="${categoryIcons[p.category] || 'shopping-bag'}" class="w-12 h-12"></i>
        </div>`;
    }

    function renderProducts() {
      const grid = document.getElementById("products-grid");
      const filtered = products.filter(p => {
        const matchesCategory = currentCategory === "Todas" || p.category === currentCategory;
        const matchesSearch = normalize(p.title).includes(searchQuery) || normalize(p.store).includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      document.getElementById("product-count").textContent = `${filtered.length} item(ns)`;

      const emptyState = document.getElementById("empty-state");
      emptyState.classList.toggle("hidden", filtered.length > 0);
      emptyState.classList.toggle("flex", filtered.length === 0);
      document.getElementById("pagination-container").classList.toggle("hidden", filtered.length === 0);

      const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, filtered.length);
      const paginatedItems = filtered.slice(startIndex, endIndex);

      grid.innerHTML = paginatedItems.map(p => `
        <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between group p-3">
          <div class="relative aspect-square overflow-hidden rounded-xl bg-gray-100 mb-2">
            ${renderImage(p)}
            <span class="absolute top-2 left-2 bg-white/90 text-gray-700 font-bold text-[10px] px-2 py-0.5 rounded-full">${p.sales} vendidos</span>
          </div>
          <div>
            <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 mb-1" title="${p.title}">${p.title}</h3>
            <p class="text-[10px] text-gray-500 flex items-center gap-1 mb-2 truncate">
              <i data-lucide="store" class="w-3 h-3 shrink-0"></i> ${p.store}
            </p>
            <span class="text-base font-black text-orange-600 block mb-2">${p.price > 0 ? formatBRL(p.price) : 'Ver Oferta'}</span>
            <a href="${p.link}" target="_blank" rel="noopener" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs py-2 rounded-xl flex items-center justify-center gap-1">
              <i data-lucide="shopping-cart" class="w-4 h-4"></i> Ver na Shopee
            </a>
          </div>
        </div>
      `).join('');

      document.getElementById("page-start").textContent = filtered.length > 0 ? startIndex + 1 : 0;
      document.getElementById("page-end").textContent = endIndex;
      document.getElementById("page-total-items").textContent = filtered.length;
      document.getElementById("btn-prev-page").disabled = currentPage === 1;
      document.getElementById("btn-next-page").disabled = currentPage === totalPages;

      renderPaginationNumbers(totalPages);
      lucide.createIcons();
    }

    function renderPaginationNumbers(totalPages) {
      const container = document.getElementById("pagination-numbers");
      let html = "";
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += `<button onclick="goToPage(${i})" class="w-8 h-8 rounded-xl text-xs font-bold ${currentPage === i ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600'}">${i}</button>`;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += `<span class="text-gray-400 text-xs px-1">...</span>`;
        }
      }
      container.innerHTML = html;
    }

    function changePage(dir) {
      currentPage += dir;
      renderProducts();
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    function goToPage(page) {
      currentPage = page;
      renderProducts();
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

  </script>
</body>
</html>
